# Конфиг для Nginx, чтобы он знал, куда отправлять запросы
apiVersion: v1
kind: ConfigMap #объект для хранения конфигурации
metadata:
  name: nginx-config
data:
  default.conf: | #имя файла, который будет создан внутри контейнера
    server {
        listen 80;
        server_name localhost;

        # апи пользователей
        location /api/users/ {
            proxy_pass http://users-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr; 
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; #цепочка IP-адресов
            proxy_set_header X-Forwarded-Proto $scheme; #протокол 
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRFToken $http_x_csrftoken;
        }
        location /api/user_profiles/ {
            proxy_pass http://users-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRFToken $http_x_csrftoken;
        }
        location /api/users_login/ {
            proxy_pass http://users-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRFToken $http_x_csrftoken;
        }

        # апи бизнеса
        location /api/projects/ {
            proxy_pass http://business-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRFToken $http_x_csrftoken;
        }
        location /api/favours/ {
            proxy_pass http://business-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRFToken $http_x_csrftoken;
        }
        location /api/project_services/ {
            proxy_pass http://business-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRFToken $http_x_csrftoken;
        }
        location /api/reviews/ {
            proxy_pass http://business-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRFToken $http_x_csrftoken;
        }

        # Админка 
        location /admin/ {
            proxy_pass http://users-service:8000; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-CSRFToken $http_x_csrftoken;
        }
        
        # Статика и медиа
        location /static/ {
            proxy_pass http://users-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }
        location /media/ {
            proxy_pass http://users-service:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        # Фронтенд (Vue)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

---
# деплой фронтенда
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: kate34534534/web2-app:frontend-v2 # Твой образ с Vue
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        volumeMounts: #монтирует ConfigMap в контейнер как файл
        - name: nginx-config-volume
          mountPath: /etc/nginx/conf.d/default.conf 
          subPath: default.conf #монтирует именно файл default.conf, а не всю папку
      volumes: #описывает том, который берет данные из nginx-config
      - name: nginx-config-volume
        configMap:
          name: nginx-config

---
# Сервис фронтенда (доступ извне через NodePort)
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort #открывает порт на каждой ноде кластера, чтобы можно было зайти снаружи
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080