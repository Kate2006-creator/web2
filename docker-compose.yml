version: '3.8'

services:
  users-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users_db_data:/var/lib/postgresql/data

  business-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: business_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - business_db_data:/var/lib/postgresql/data

  users-service:
    build: ./users_service
    environment:
      DB_HOST: users-db
      DB_NAME: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8001:8000"
    depends_on:
      - users-db

  business-service:
    build: ./business_service
    environment:
      DB_HOST: business-db
      DB_NAME: business_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8002:8000"
    depends_on:
      - business-db
      - users-service

  frontend:
    build: ./client
    ports:
      - "3000:3000"

volumes:
  users_db_data:
  business_db_data: