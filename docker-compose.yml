services:
  backend:
    build: .
    image: kate34534534/web2-backend:latest
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    networks:
      - webnet
    expose:
      - "8000"

  frontend:
    build: ./client
    image: kate34534534/web2-frontend:latest
    networks:
      - webnet
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - webnet

networks:
  webnet:
    driver: bridge